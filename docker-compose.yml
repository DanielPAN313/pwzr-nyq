services:
  mysql:
    image: mysql:8.4
    container_name: nyq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nyq}
      MYSQL_USER: ${MYSQL_USER:-nyq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_app_password}
    ports:
      - "${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-nyq} -p${MYSQL_PASSWORD:-change_app_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: nyq-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4174}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-nyq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_app_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nyq}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-}
      OBJECT_STORAGE_UPLOAD_URL: ${OBJECT_STORAGE_UPLOAD_URL:-}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      OBJECT_STORAGE_SIGNING_SECRET: ${OBJECT_STORAGE_SIGNING_SECRET:-}
      NYQ_ALLOW_DEV_AUTH: ${NYQ_ALLOW_DEV_AUTH:-false}
      NYQ_DEV_VENUE_BINDING: ${NYQ_DEV_VENUE_BINDING:-false}
    ports:
      - "${PORT:-4174}:${PORT:-4174}"
    volumes:
      - ./secrets:/run/secrets:ro

volumes:
  mysql_data:
